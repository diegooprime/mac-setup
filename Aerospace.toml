start-at-login = true
accordion-padding = 10
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = true
enable-normalization-flatten-containers = false

[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'secondary' 
3 = 'secondary' 
4 = 'secondary' 
5 = 'main'
6 = 'secondary' 
7 = 'secondary' 

[mode.main.binding]
ctrl-alt-cmd-shift-space = 'focus-monitor --wrap-around next' 
ctrl-alt-cmd-shift-tab    = 'move-node-to-monitor --wrap-around --focus-follows-window next'
# Hyper+; → maximize (tiling fullscreen)
ctrl-alt-cmd-shift-semicolon = "fullscreen"

ctrl-alt-cmd-shift-b = "workspace 1"
ctrl-alt-cmd-shift-c = "workspace 2"
ctrl-alt-cmd-shift-3 = "workspace 3" 
ctrl-alt-cmd-shift-0 = "workspace 4" 
ctrl-alt-cmd-shift-5 = "workspace 5"
ctrl-alt-cmd-shift-6 = "workspace 6"
ctrl-alt-cmd-shift-7 = "workspace 7"

[[on-window-detected]]
check-further-callbacks = true
run = "layout tiling"
