start-at-login = true
accordion-padding = 0
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-orientation = 'horizontal'

# Cursor follows focus
on-focus-changed = ['move-mouse window-lazy-center']
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Notify SketchyBar on workspace change
exec-on-workspace-change = ['/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change SID=$AEROSPACE_FOCUSED_WORKSPACE'
]

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.right = 0
outer.top = 31
outer.bottom = 0

[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 2
4 = 2
7 = 2
8 = 2
5 = 3
6 = 3

# ========================
# MAIN MODE
# ========================
[mode.main.binding]

# --- Focus navigation (hyper+hjkl) — smart: tmux panes in terminal, windows elsewhere ---
ctrl-alt-cmd-shift-h = 'exec-and-forget /bin/bash ~/.config/aerospace/focus.sh left'
ctrl-alt-cmd-shift-j = 'exec-and-forget /bin/bash ~/.config/aerospace/focus.sh down'
ctrl-alt-cmd-shift-k = 'exec-and-forget /bin/bash ~/.config/aerospace/focus.sh up'
ctrl-alt-cmd-shift-l = 'exec-and-forget /bin/bash ~/.config/aerospace/focus.sh right'

# --- Workspace switching ---
ctrl-alt-cmd-shift-1 = ["workspace 1", "move-mouse monitor-lazy-center"]
ctrl-alt-cmd-shift-2 = ["workspace 2", "move-mouse monitor-lazy-center"]
ctrl-alt-cmd-shift-c = ["workspace 3", "move-mouse monitor-lazy-center"]
ctrl-alt-cmd-shift-6 = ["workspace 4", "move-mouse monitor-lazy-center"]
ctrl-alt-cmd-shift-7 = ["workspace 5", "move-mouse monitor-lazy-center"]
ctrl-alt-cmd-shift-8 = ["workspace 6", "move-mouse monitor-lazy-center"]
ctrl-alt-cmd-shift-0 = ["workspace 7", "move-mouse monitor-lazy-center"]
ctrl-alt-cmd-shift-n = ["workspace 8", "move-mouse monitor-lazy-center"]
ctrl-alt-cmd-shift-minus = "workspace --wrap-around next"

# --- Monitor ---
ctrl-alt-cmd-shift-space = 'focus-monitor --wrap-around next'
ctrl-alt-cmd-shift-tab   = 'move-node-to-monitor --wrap-around --focus-follows-window next'

# --- Layout ---
cmd-m = 'macos-native-minimize'
ctrl-alt-cmd-shift-semicolon = 'fullscreen'
ctrl-alt-cmd-shift-u = 'layout v_tiles'
ctrl-alt-cmd-shift-z = 'layout h_tiles'
ctrl-alt-cmd-shift-e = 'balance-sizes'
ctrl-alt-cmd-shift-r = 'flatten-workspace-tree'

# --- Service mode (hyper+slash) ---
ctrl-alt-cmd-shift-slash = 'mode service'

# --- Custom ---
ctrl-alt-cmd-shift-b = 'exec-and-forget /bin/bash /Users/p/scripts/start-huddle.sh'

# ========================
# SERVICE MODE — for moving/resizing/sending windows
# Press hyper+. to enter, esc to exit
# ========================
[mode.service.binding]
# Move windows
h = 'move left'
j = 'move down'
k = 'move up'
l = 'move right'

# Resize windows
shift-h = 'resize width -50'
shift-l = 'resize width +50'
shift-j = 'resize height +50'
shift-k = 'resize height -50'

# Layout
t = 'layout tiles horizontal vertical'
f = 'layout floating tiling'

# Send to workspace + exit
1 = ['move-node-to-workspace 1', 'mode main']
2 = ['move-node-to-workspace 2', 'mode main']
3 = ['move-node-to-workspace 3', 'mode main']
4 = ['move-node-to-workspace 4', 'mode main']
5 = ['move-node-to-workspace 5', 'mode main']
6 = ['move-node-to-workspace 6', 'mode main']
7 = ['move-node-to-workspace 7', 'mode main']
8 = ['move-node-to-workspace 8', 'mode main']

# Utility
b = ['balance-sizes', 'mode main']
r = ['flatten-workspace-tree', 'mode main']

# Exit
esc = 'mode main'
enter = 'mode main'

# ========================
# WINDOW RULES
# ========================

# --- Float rules ---

[[on-window-detected]]
if.app-id = 'com.kagi.kagimacOS'
if.window-title-regex-substring = '^$'
check-further-callbacks = false
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.kagi.kagimacOS'
if.window-title-regex-substring = '^Untitled$'
check-further-callbacks = false
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.colliderli.iina'
check-further-callbacks = false
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.workingmemory.tasks'
check-further-callbacks = false
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
check-further-callbacks = false
run = 'layout floating'

# --- Auto-route apps to workspaces ---

# Arc → workspace 1
[[on-window-detected]]
if.app-id = 'company.thebrowser.Browser'
check-further-callbacks = false
run = 'move-node-to-workspace 1'

# Ghostty → workspace 3
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
check-further-callbacks = false
run = ['layout tiling', 'move-node-to-workspace 3']

# Alacritty → workspace 3
[[on-window-detected]]
if.app-id = 'org.alacritty'
check-further-callbacks = false
run = ['layout tiling', 'move-node-to-workspace 3']

# Obsidian → workspace 7
[[on-window-detected]]
if.app-id = 'md.obsidian'
check-further-callbacks = false
run = ['layout tiling', 'move-node-to-workspace 7']

# WhatsApp → workspace 2, always left
[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
check-further-callbacks = false
run = ['move-node-to-workspace 2', 'move left']

# Spotify → workspace 2
[[on-window-detected]]
if.app-id = 'com.spotify.client'
check-further-callbacks = false
run = 'move-node-to-workspace 2'

# --- Catch-all: tile everything else ---
[[on-window-detected]]
check-further-callbacks = false
run = "layout tiling"
