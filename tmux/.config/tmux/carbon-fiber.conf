# Carbon Fiber palette for tmux

# Status bar — transparent, blends into terminal
set -g status-position bottom
set -g status-style "bg=default,fg=#6a6a6c"
set -g status-justify left

# Messages
set -g message-style "bg=#232325,fg=#e8e8e8"
set -g message-command-style "bg=#232325,fg=#e05030"

# Pane borders
set -g pane-border-lines heavy
set -g pane-border-style "fg=#2a2a2c"
set -g pane-active-border-style "fg=#e05030"

# All info lives in pane borders
set -g pane-border-status bottom
set -g pane-border-format "#{?pane_active,#[fg=#e05030]● #[fg=#6a6a6c]#{b:pane_current_path} #(gitmux -cfg $HOME/.config/tmux/gitmux.conf '#{pane_current_path}')#[default],#[fg=#2a2a2c]#{b:pane_current_path}#[default]}"

# No dimming — clean
set -g window-style "fg=#e8e8e8,bg=#121214"
set -g window-active-style "fg=#e8e8e8,bg=#121214"
