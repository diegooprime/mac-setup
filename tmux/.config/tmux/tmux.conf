set -g default-terminal "tmux-256color"

# Terminal features for alacritty (sync = synchronized output to prevent flicker)
set -g terminal-features "alacritty:RGB:clipboard:ccolour:cstyle:focus:title:sync"
set-option -sa terminal-overrides ",alacritty:Tc,alacritty:Sync=y"
set-option -sa terminal-overrides ",xterm*:Tc"

# Reduce escape delay (helps with responsiveness)
set -sg escape-time 0

# Better alternate screen handling
set-option -g alternate-screen on
set -g mouse on
set -g detach-on-destroy off

# Mitigate Claude Code scroll flood (delays buffer overflow)
set -g history-limit 250000

# Ctrl+Space as prefix (daily driver keyboard)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# § as secondary prefix (desktop keyboard)
set -g prefix2 §
bind § send-prefix -2

# Keybindings
bind n new-window -c "$HOME"
bind t command-prompt -p "session name:" "new-session -s '%%'"
set -g allow-rename off
bind e command-prompt -I "#W" "rename-window '%%'"
bind m switch-client -n
bind x kill-session
bind Tab next-window
bind Space select-pane -t :.+
bind w kill-pane
bind q kill-window
bind b split-window -v -c "#{pane_current_path}"
bind g split-window -h -c "#{pane_current_path}"
set -g @resize_step 15
bind -r h resize-pane -L #{@resize_step}
bind -r j resize-pane -D #{@resize_step}
bind -r k resize-pane -U #{@resize_step}
bind -r l resize-pane -R #{@resize_step}

# Copy code blocks from Claude Code
bind j run-shell "$HOME/.config/tmux/scripts/copy-last-code-block.sh"
bind k display-popup -E -w 80% -h 60% "$HOME/.config/tmux/scripts/copy-code-block-picker.sh"

bind-key -n M-d run-shell "$HOME/.config/tmux/scripts/copy-visible-pane.sh"
bind-key -n M-y run-shell "$HOME/.config/tmux/scripts/copy-pane-visible.sh"
bind-key -n M-v run-shell "$HOME/.config/tmux/scripts/copy-visible-pane.sh"
bind-key -n M-e run-shell "$HOME/.config/tmux/scripts/copy-pane-visible.sh"
bind-key -T copy-mode M-v send-keys -X cancel \; run-shell "$HOME/.config/tmux/scripts/copy-visible-pane.sh"
bind-key -T copy-mode M-e send-keys -X cancel \; run-shell "$HOME/.config/tmux/scripts/copy-pane-visible.sh"

bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
bind 0 select-window -t 10

set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# Status bar colors (manual Catppuccin Mocha theme)
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-style "bg=#1e1e2e,fg=#89b4fa"
set -g status-right-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-interval 2

# Window status colors
setw -g window-status-style "bg=#1e1e2e,fg=#6c7086"
setw -g window-status-current-style "bg=#313244,fg=#89b4fa,bold"

# Left: session name + window list
set -g status-left "#[fg=#89b4fa,bg=#1e1e2e,bold] #S #[fg=#6c7086]│ "
set -g status-left-length 50

# Window list format
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[fg=#89b4fa,bg=#313244,bold] #I:#W "

# Right: cpu used | ram used | battery | network status
set -g status-right "#[fg=#f5c2e7]cpu #{cpu_percentage} #[fg=#6c7086]│ #[fg=#fab387]ram #($HOME/.config/tmux/scripts/ram_used_percentage.sh) #[fg=#6c7086]│ #[fg=#94e2d5]#{battery_percentage} #($HOME/.config/tmux/scripts/battery_plug_icon.sh) #[fg=#6c7086]│ #($HOME/.config/tmux/scripts/network_status_icon.sh)"
set -g status-right-length 150

# Network bandwidth format
set -g @download_speed_format "%0.1f"
set -g @upload_speed_format "%0.1f"

# Plugins (NO CATPPUCCIN)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'xamut/tmux-network-bandwidth'

run "$HOME/.config/tmux/plugins/tpm/tpm"
